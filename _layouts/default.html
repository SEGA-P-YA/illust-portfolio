<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="{% if page.layout == 'work' %}article{% else %}website{% endif %}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <link rel="icon" href="data:," />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% if site.ga4_id and site.ga4_id != "" %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', '{{ site.ga4_id }}');
      window.trackEvent = function (name, params) { try { gtag('event', name, params || {}); } catch (e) {} };
    </script>
    {% else %}
    <script>window.trackEvent = function () {};</script>
    {% endif %}
  </head>
  <body>
    {{ content }}
  </body>
</html>
